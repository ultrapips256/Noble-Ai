<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NobleAI Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(#000,#042b20);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}
.login-box{
width:90%;max-width:360px;
background:#111;
padding:25px;
border-radius:20px;
border:1px solid #00ff99;
box-shadow:0 0 20px rgba(0,255,153,.3);
}
.logo{text-align:center;font-size:32px;font-weight:bold;color:#00ff99;margin-bottom:10px}
p{text-align:center;color:#bbb;margin-bottom:20px}
input{
width:100%;padding:14px;margin:10px 0;
background:#000;border:1px solid #00ff99;
border-radius:10px;color:white;
}
button{
width:100%;padding:14px;background:#00ff99;
border:none;border-radius:10px;font-weight:bold;color:black;
}
a{color:#00ff99;text-decoration:none;font-size:14px}
.links{text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">NobleAI</div>
<p>Welcome back, Trader.</p>
<input type="email" placeholder="Email Address">
<input type="password" placeholder="Password">
<button>LOGIN</button>
<div class="links">
<p><a href="#">Forgot Password?</a></p>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
</body>
</html>
