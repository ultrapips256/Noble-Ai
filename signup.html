<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NobleAI Sign Up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(#000,#042b20);display:flex;justify-content:center;align-items:center;min-height:100vh;color:white;padding:20px}
.box{width:100%;max-width:380px;background:#111;padding:25px;border-radius:20px;border:1px solid #00ff99;box-shadow:0 0 20px rgba(0,255,153,.3)}
.logo{text-align:center;font-size:32px;font-weight:bold;color:#00ff99;margin-bottom:10px}
input{width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid #00ff99;border-radius:10px;color:white}
button{width:100%;padding:14px;background:#00ff99;border:none;border-radius:10px;font-weight:bold;color:black;margin-top:10px}
a{color:#00ff99;text-decoration:none}
.center{text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<div class="logo">NobleAI</div>
<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email Address">
<input type="password" placeholder="Create Password">
<input type="password" placeholder="Confirm Password">
<button>CREATE ACCOUNT</button>
<div class="center">
Already have an account? <a href="login.html">Login</a><br><br>
<a href="index.html">← Back to Home</a>
</div>
</div>
</body>
</html>
